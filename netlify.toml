[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: send every path to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Server functions (photo to pattern). Set ANTHROPIC_API_KEY in Site configuration > Environment variables.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
