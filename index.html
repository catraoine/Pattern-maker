<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- The app is dark by design: stops Samsung Internet's dark mode from re-colouring it. -->
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Sewing patterns drafted to your own measurements." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Maison Tracé" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Pinterest site claim for the Maison Tracé business account. -->
    <meta name="p:domain_verify" content="25dd8befba2ab124e0ea5779f337f838" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Maison Tracé</title>
    <!-- Shown until the app's own code arrives: on a slow phone the first load was a plain black screen for 10 s and
         more, with no name and no sign it was loading (pretend tester, Nov 18). The app replaces it as it starts. -->
    <style>
      body { background: #000; margin: 0; }
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #efe4cc; font: 500 13px/1 system-ui, -apple-system, sans-serif; letter-spacing: 0.32em; text-indent: 0.32em; }
      .boot i { display: block; width: 64px; height: 1px; background: #efe4cc; opacity: 0.25; animation: boot 1.6s ease-in-out infinite; }
      @keyframes boot { 50% { opacity: 0.9; } }
      /* On a slow phone the app takes a while to arrive (about 13 s on the DI walk, Nov 19): after a few seconds a
         plain line says it is still coming, so the black screen doesn't read as stuck. */
      .boot span { font: 400 13px/1.4 system-ui, -apple-system, sans-serif; letter-spacing: 0; text-indent: 0; color: #efe4cc; opacity: 0; max-width: 260px; text-align: center; animation: boot-say 0.6s ease-out 3s forwards; }
      @keyframes boot-say { to { opacity: 0.6; } }
      @media (prefers-reduced-motion: reduce) { .boot i { animation: none; opacity: 0.5; } .boot span { animation: boot-say 0s linear 3s forwards; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Maison Tracé is starting">MAISON TRACÉ<i></i><span>Still loading. On a slow connection this can take a few seconds.</span></div></div>
    <!-- Lets Netlify Forms find the dressmaker sign-up; the app posts to it from the Print screen. -->
    <form name="find-a-maker" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input type="text" name="pattern" />
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
