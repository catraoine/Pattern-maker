name: Quality checks nightly

# Every night, the Quality: Automated checks department's checks at full size (Cat, 2026-11-04). The same checks run on
# every pull request at a smaller size (see e2e.yml); this run only reports. The department's nightly read takes the
# "Summary" step's log and tells Cat only when something got worse.
# - Pattern geometry: every option of every garment, on the example body and on random bodies (src/patternSweep.ts), and
#   on random men's bodies on the menswear form.
# - Fit sweep: 300 new random bodies each night, a random design of every garment on each (src/fitSweep.ts).
# - Print check: the sample patterns' PDFs on A4, Letter and A0, rendered and measured (src/printCheck.ts).
# - Front drawing: every option's drawing on the form, read out of the real app and scored (src/frontCheck.ts).
# - Screens: every screen photographed on a phone and a computer, looked over for words cut off (e2e/screenAudit.ts).
# - Front drawing and screens on the menswear form, as the example man (Nov 22): their own jobs, report-only, so they
#   never change the womenswear checks.
# - DXF round trip: every option's DXF read back and held to the draft, on random bodies too (src/dxfRoundTrip.ts).
# - Firefox: the tester walks and the laptop screen sizes in Firefox on a computer (Cat's "apply", Nov 21).
on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:
    inputs:
      bodies:
        description: How many random bodies for the pattern geometry check
        default: '20'

jobs:
  firefox:
    name: Tester walks in Firefox (computer)
    runs-on: ubuntu-24.04 # Playwright's browsers don't install on later Ubuntu yet
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Firefox
        run: npx playwright install --with-deps firefox
      - run: npm run test:e2e -- --project firefox journey-nov10.spec.ts tester-journey-nov11.spec.ts --retries 0
        continue-on-error: true
      - name: Page at failure
        if: ${{ !cancelled() }}
        run: for f in test-results/*/error-context.md; do echo "=== $f"; head -80 "$f"; done
        env:
          CI: true
          E2E_FIREFOX: '1'
      - name: Summary
        if: ${{ !cancelled() }}
        run: echo "Firefox tester walks finished with ${{ job.status }}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: quality-nightly-firefox
          path: |
            playwright-report/
            test-results/
          retention-days: 14
